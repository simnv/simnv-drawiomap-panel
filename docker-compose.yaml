# Dev and test stack. Both Grafana versions mount the same dist/ and provisioning/.
# Start: docker compose up -d        Stop: docker compose down -v
x-grafana-env: &grafana-env
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: simnv-drawiomap-panel
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
  GF_DEFAULT_APP_MODE: development
  GF_LOG_LEVEL: warn
  GF_NEWS_NEWS_FEED_ENABLED: "false"
x-grafana-volumes: &grafana-volumes
  - ./dist:/var/lib/grafana/plugins/simnv-drawiomap-panel
  - ./provisioning:/etc/grafana/provisioning

services:
  grafana12:
    image: grafana/grafana:12.4.13
    ports: ["3012:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13:
    image: grafana/grafana:13.2.4
    ports: ["3013:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  drawio:
    image: jgraph/drawio:32.4.1
    ports: ["8080:8080"]
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    ports: ["8428:8428"]
    command: ["-retentionPeriod=2d", "-search.latencyOffset=0s"]
  metrics-gen:
    image: python:3.12-alpine
    volumes: ["./stack/metrics-gen:/app:ro"]
    environment:
      VM_URL: http://victoriametrics:8428
    command: ["python", "-I", "/app/gen.py"]
    depends_on: [victoriametrics]
    restart: unless-stopped
