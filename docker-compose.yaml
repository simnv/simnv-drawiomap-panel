# Dev and test stack. All Grafana services mount the same dist/ and provisioning/.
# Start: docker compose up -d --force-recreate --wait        Stop: docker compose down -v
# Editor isolation checks (docs/security.md): the services of the profile "isolation" start only when you name them:
#   docker compose --profile isolation up -d --wait grafana13-sandbox
#   docker compose --profile isolation down -v
x-grafana-env: &grafana-env
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: simnv-drawiomap-panel
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
  GF_DEFAULT_APP_MODE: development
  GF_LOG_LEVEL: warn
  GF_NEWS_NEWS_FEED_ENABLED: "false"
  # A test dashboard can refresh every second (tests/link-strokes.spec.ts). The default minimum is 5 s.
  GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
x-sandbox-env: &sandbox-env
  <<: *grafana-env
  GF_SECURITY_ENABLE_FRONTEND_SANDBOX_FOR_PLUGINS: simnv-drawiomap-panel
  GF_FEATURE_TOGGLES_ENABLE: pluginsFrontendSandbox
# Grafana reads its plugin folder only when it starts. Without a built dist/, the panel shows "Panel plugin not found",
# and a build after the start does not help until Grafana restarts. So dist/ must exist before `docker compose up`
# (create_host_path: false: Docker does not make an empty dist/, which is root-owned on Linux), and the service
# plugin-dist stops the start when dist/ has no built plugin. Run `npm run build` first.
x-grafana-volumes: &grafana-volumes
  - type: bind
    source: ./dist
    target: /var/lib/grafana/plugins/simnv-drawiomap-panel
    bind: { create_host_path: false }
  - ./provisioning:/etc/grafana/provisioning
x-grafana-depends: &grafana-depends
  victoriametrics: { condition: service_started }
  plugin-dist: { condition: service_completed_successfully }

services:
  grafana123:
    image: grafana/grafana:12.3.11
    ports: ["127.0.0.1:3011:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana12:
    image: grafana/grafana:12.4.13
    ports: ["127.0.0.1:3012:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana13:
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:3013:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  # Profile "isolation": frontend sandbox, content_security_policy = true, app_sub_url.
  grafana12-sandbox:
    image: grafana/grafana:12.4.13
    profiles: [isolation]
    ports: ["127.0.0.1:3122:3000"]
    environment: *sandbox-env
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana13-sandbox:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3123:3000"]
    environment: *sandbox-env
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana13-csp:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3133:3000"]
    environment:
      <<: *grafana-env
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana13-sandbox-csp:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3143:3000"]
    environment:
      <<: *sandbox-env
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  grafana13-subpath:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3153:3000"]
    environment:
      <<: *grafana-env
      GF_SERVER_ROOT_URL: http://localhost:3153/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes: *grafana-volumes
    depends_on: *grafana-depends
  plugin-dist:
    image: busybox:1.37
    volumes:
      - type: bind
        source: ./dist
        target: /dist
        read_only: true
        bind: { create_host_path: false }
    command:
      - sh
      - -c
      - test -f /dist/plugin.json && test -f /dist/module.js || { echo "dist/ has no built plugin. Run npm run build, then docker compose up again." >&2; exit 1; }
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    ports: ["127.0.0.1:8428:8428"]
    command: ["-retentionPeriod=2d", "-search.latencyOffset=0s"]
  metrics-gen:
    image: python:3.12-alpine
    volumes: ["./stack/metrics-gen:/app:ro"]
    environment:
      VM_URL: http://victoriametrics:8428
    command: ["python", "-I", "/app/gen.py"]
    depends_on: [victoriametrics]
    restart: unless-stopped
