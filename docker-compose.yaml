# Dev and test stack. All Grafana services mount the same dist/ and provisioning/.
# Start: docker compose up -d --force-recreate --wait        Stop: docker compose down -v
# Editor isolation checks (docs/security.md): the services of the profile "isolation" start only when you name them:
#   docker compose --profile isolation up -d --wait grafana13-sandbox
#   docker compose --profile isolation down -v
x-grafana-env: &grafana-env
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: simnv-drawiomap-panel
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
  GF_DEFAULT_APP_MODE: development
  GF_LOG_LEVEL: warn
  GF_NEWS_NEWS_FEED_ENABLED: "false"
x-sandbox-env: &sandbox-env
  <<: *grafana-env
  GF_SECURITY_ENABLE_FRONTEND_SANDBOX_FOR_PLUGINS: simnv-drawiomap-panel
  GF_FEATURE_TOGGLES_ENABLE: pluginsFrontendSandbox
x-grafana-volumes: &grafana-volumes
  - ./dist:/var/lib/grafana/plugins/simnv-drawiomap-panel
  - ./provisioning:/etc/grafana/provisioning

services:
  grafana12:
    image: grafana/grafana:12.4.13
    ports: ["127.0.0.1:3012:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13:
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:3013:3000"]
    environment: *grafana-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  # Profile "isolation": frontend sandbox, content_security_policy = true, app_sub_url.
  grafana12-sandbox:
    image: grafana/grafana:12.4.13
    profiles: [isolation]
    ports: ["127.0.0.1:3122:3000"]
    environment: *sandbox-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13-sandbox:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3123:3000"]
    environment: *sandbox-env
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13-csp:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3133:3000"]
    environment:
      <<: *grafana-env
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13-sandbox-csp:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3143:3000"]
    environment:
      <<: *sandbox-env
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  grafana13-subpath:
    image: grafana/grafana:13.2.4
    profiles: [isolation]
    ports: ["127.0.0.1:3153:3000"]
    environment:
      <<: *grafana-env
      GF_SERVER_ROOT_URL: http://localhost:3153/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes: *grafana-volumes
    depends_on: [victoriametrics]
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    ports: ["127.0.0.1:8428:8428"]
    command: ["-retentionPeriod=2d", "-search.latencyOffset=0s"]
  metrics-gen:
    image: python:3.12-alpine
    volumes: ["./stack/metrics-gen:/app:ro"]
    environment:
      VM_URL: http://victoriametrics:8428
    command: ["python", "-I", "/app/gen.py"]
    depends_on: [victoriametrics]
    restart: unless-stopped
