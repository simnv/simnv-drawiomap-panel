# Playwright e2e tests on each Grafana version of the matrix (the same images as docker-compose.yaml).
# The steps have no docker socket and no bind mounts. The stack runs as detached steps on the network of the
# workflow; the step name is the hostname. Grafana reads the plugin and the provisioning from the workspace
# (scripts/ci-grafana-files.sh). The steps need no trusted-repository settings, no volumes and no privileged mode.
when:
  - event: [push, pull_request, manual]

depends_on:
  - build

matrix:
  GRAFANA:
    - 12.4.13
    - 13.2.4

steps:
  - name: build
    image: node:24-bookworm
    commands:
      - npm ci
      - npm run build
      - ./scripts/ci-grafana-files.sh

  - name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.126.0
    detach: true
    # The same flags as docker-compose.yaml. The data stays outside of the workspace.
    entrypoint:
      - /victoria-metrics-prod
      - -retentionPeriod=2d
      - -search.latencyOffset=0s
      - -storageDataPath=/victoria-metrics-data

  - name: metrics-gen
    image: python:3.12-alpine
    detach: true
    environment:
      VM_URL: http://victoriametrics:8428
    commands:
      - python -I stack/metrics-gen/gen.py

  - name: grafana
    image: grafana/grafana:${GRAFANA}
    detach: true
    # The same GF_* settings as x-grafana-env in docker-compose.yaml.
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: simnv-drawiomap-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DEFAULT_APP_MODE: development
      GF_LOG_LEVEL: warn
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    commands:
      - export GF_PATHS_PLUGINS="$${CI_WORKSPACE}/ci/plugins"
      - export GF_PATHS_PROVISIONING="$${CI_WORKSPACE}/ci/provisioning"
      - exec /run.sh

  - name: wait
    image: node:24-bookworm
    environment:
      VM_URL: http://victoriametrics:8428
      GRAFANA_URL: http://grafana:3000
    commands:
      - ./scripts/wait-stack.sh

  - name: e2e
    # Keep the image version the same as @playwright/test in package-lock.json. The first command checks it.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    environment:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.1
      GRAFANA_URL: http://grafana:3000
    commands:
      - test "$(node -p 'require("@playwright/test/package.json").version')" = "$${PLAYWRIGHT_IMAGE_VERSION}"
      - npx playwright test
