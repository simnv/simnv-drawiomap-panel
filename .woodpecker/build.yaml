# Build and checks. scripts/ci-local.sh runs the same steps on a developer machine (npm run ci:local).
# No cache: each run downloads the pinned draw.io release (about 46 MB from github.com, sha256 check in
# scripts/vendor-drawio.sh). The steps need no trusted-repository settings, no volumes and no privileged mode.
when:
  - event: [push, pull_request, manual]

steps:
  - name: install
    image: node:24-bookworm
    commands:
      - node --version
      - npm ci

  - name: privacy
    image: node:24-bookworm
    commands:
      - sh .githooks/check-denylist.sh --all

  - name: typecheck
    image: node:24-bookworm
    commands:
      - npm run typecheck

  - name: lint
    image: node:24-bookworm
    commands:
      - npm run lint

  - name: test
    image: node:24-bookworm
    commands:
      - npm test

  - name: build
    image: node:24-bookworm
    commands:
      - npm run build

  - name: check-bundle
    image: node:24-bookworm
    commands:
      - npm run check:bundle

  - name: package
    image: node:24-bookworm
    commands:
      - npm run package
      - ls -l artifacts/
      - cat artifacts/*.sha256
