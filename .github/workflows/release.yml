# Publishes the plugin zip as a GitHub Release.
# Push a tag vX.Y.Z (the version in package.json) to release that version. To release a tag that was pushed before
# this workflow existed, run the workflow by hand (Actions > Release > Run workflow) with the tag.
# The zip is not signed: Grafana loads it only with allow_loading_unsigned_plugins (README section "Install").
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, for example v1.5.0.
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag must have the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  checks:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  release:
    name: release
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Only reads package.json and CHANGELOG.md of the tag. No npm step runs with the write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: artifacts

      - name: check version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG differs from package.json version $version"
            exit 1
          fi
          zip="artifacts/simnv-drawiomap-panel-$version.zip"
          test -f "$zip" || { echo "::error::$zip is missing"; ls -l artifacts; exit 1; }
          (cd artifacts && sha256sum -c "$(basename "$zip").sha256")
          echo "VERSION=$version" >>"$GITHUB_ENV"

      # The notes are the CHANGELOG section "## <version>" (the heading may have a suffix, for example "(Unreleased)").
      - name: release notes
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          {
            echo
            echo "## Install"
            echo
            echo "The plugin is not signed. Set \`allow_loading_unsigned_plugins = simnv-drawiomap-panel\` (or \`GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS\`), then:"
            echo
            echo '```bash'
            echo "grafana cli --pluginUrl https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/simnv-drawiomap-panel-$VERSION.zip plugins install simnv-drawiomap-panel"
            echo '```'
            echo
            echo "See the README section \"Install\" for Docker and a manual install."
          } >>notes.md
          cat notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "artifacts/simnv-drawiomap-panel-$VERSION.zip" \
            "artifacts/simnv-drawiomap-panel-$VERSION.zip.sha256"
